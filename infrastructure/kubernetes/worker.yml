apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker

spec:
  replicas: 3

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: ghcr.io/ivansevill/ai-inference-platform-worker:latest

          ports:
            - containerPort: 9100

          env:
            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS

            - name: POSTGRES_HOST
              value: postgres

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: OLLAMA_HOST
              value: http://ollama:11434

            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_MODEL

---
apiVersion: v1
kind: Service

metadata:
  name: worker-metrics

spec:
  selector:
    app: worker

  ports:
    - port: 9100
      targetPort: 9100

  type: ClusterIP
