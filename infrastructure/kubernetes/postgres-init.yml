apiVersion: v1
kind: ConfigMap

metadata:
  name: postgres-init

data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS jobs (
        id UUID PRIMARY KEY,
        prompt TEXT NOT NULL,

        status VARCHAR(20) NOT NULL
            CHECK (status IN ('PENDING', 'PROCESSING', 'COMPLETED', 'FAILED')),

        result TEXT,
        error TEXT,

        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

---
apiVersion: batch/v1
kind: Job

metadata:
  name: postgres-init

spec:
  template:
    metadata:
      labels:
        app: postgres-init

    spec:
      restartPolicy: OnFailure

      containers:
        - name: postgres-init
          image: postgres:17

          env:
            - name: PGHOST
              value: postgres

            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          command:
            - sh
            - -c

          args:
            - |
              until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              psql -v ON_ERROR_STOP=1 -f /sql/init.sql

          volumeMounts:
            - name: init-sql
              mountPath: /sql

      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
