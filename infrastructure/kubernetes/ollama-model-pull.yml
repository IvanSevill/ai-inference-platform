apiVersion: batch/v1
kind: Job

metadata:
  name: ollama-model-pull

spec:
  template:
    metadata:
      labels:
        app: ollama-model-pull

    spec:
      restartPolicy: OnFailure

      containers:
        - name: model-pull
          image: ollama/ollama@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551

          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434

            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: ollama-config
                  key: OLLAMA_MODEL

          command:
            - sh
            - -c

          args:
            - |
              until ollama list; do
                echo "Waiting for Ollama..."
                sleep 2
              done

              ollama pull "$OLLAMA_MODEL"
