apiVersion: apps/v1
kind: Deployment

metadata:
  name: api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: ghcr.io/ivansevill/ai-inference-platform-api:latest

          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service

metadata:
  name: api

spec:
  selector:
    app: api

  ports:
    - port: 8000
      targetPort: 8000

  type: ClusterIP